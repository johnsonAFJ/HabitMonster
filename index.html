<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Habit Monster</title>
  <meta name="theme-color" content="#f4ecdb">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon-192.png">
  <!-- Home screen install on iPhone -->
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Monster">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>Habit Monster</h1>
      <p class="today" id="today"></p>
    </header>

    <!-- Shown until a starter is chosen, and any time it is changed before
         the egg hatches. Only the hatchling is ever drawn here. -->
    <section class="picker" id="picker" hidden aria-label="Pick your monster">
      <h2 class="picker-title">Pick your monster</h2>
      <p class="picker-lede">Three eggs are ready to hatch. Which one do you want?</p>
      <div class="picks" id="picks"></div>
      <p class="picker-note">These are the babies. Each one grows into something else twice along the way.</p>
    </section>

    <section class="game" id="game" hidden>
      <canvas id="scene" width="256" height="160" aria-label="Your monster at home"></canvas>
      <p class="cheer" id="cheer" role="status" aria-live="polite"></p>

      <div class="status" id="status">
        <div class="status-head">
          <h2 id="monster-name">Egg</h2>
          <span class="level" id="level"></span>
        </div>
        <div class="xp" id="xp-track">
          <div class="xp-fill" id="xp-fill"></div>
        </div>
        <div class="status-foot">
          <span class="xp-label" id="xp-label"></span>
          <span class="pips" id="health"></span>
        </div>
        <p class="restart"><button type="button" class="link" id="change-starter">Pick a different one</button></p>
      </div>

      <section class="stats-panel" id="stats-panel" hidden>
        <h2>Stats</h2>
        <dl class="stat-list" id="stat-list"></dl>
      </section>

      <section class="cards" id="cards" aria-label="Habits"></section>
    </section>

    <footer class="bottom">
      <div class="backup">
        <button type="button" class="ghost" id="export">Export backup</button>
        <label class="ghost file">
          Import backup
          <input type="file" id="import" accept="application/json,.json">
        </label>
        <span id="backup-age"></span>
      </div>
      <p class="art-note" id="art-note"></p>
    </footer>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
